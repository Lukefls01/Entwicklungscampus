<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT Entwicklungscampus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig und architektonisch, wie ein Wettbewerbs-Rendering
   IDEA: begehbares Architekturmodell eines Holz-Glas-Campus im Wald
   PICTURE: die 3D-Szene füllt den ganzen Bildschirm
   COLOUR and TYPE: Waldgrün, Rauchglas-Panels, Holz-Amber als Akzent; Manrope
   LAYOUT: Titel oben links, Ansichten und Tageszeit unten mittig */
:root{color-scheme:dark;--glass:rgba(13,21,18,.6);--line:rgba(255,255,255,.15);--ink:#f4f2ec;--mut:#c5ccc2;--acc:#e3aa60}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1411;color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.panel{background:var(--glass);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid var(--line);border-radius:16px}
#title{position:fixed;left:16px;top:16px;padding:12px 16px;max-width:min(380px,calc(100vw - 32px))}
#title h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
#title p{margin:3px 0 0;color:var(--mut);font-size:13px}
#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;padding:10px;width:max-content;max-width:calc(100vw - 20px)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:40px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
button:hover{background:rgba(255,255,255,.17)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed=true]{background:var(--acc);color:#20160a;border-color:transparent}
.time{display:flex;align-items:center;gap:10px;padding:0 4px 0 10px;font-size:14px;color:var(--mut)}
.time input{width:min(230px,40vw);accent-color:var(--acc);height:40px}
.time output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;min-width:3.1em}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#clock{position:fixed;right:16px;top:16px;padding:12px 16px;min-width:230px;display:grid;gap:3px}
#clock .now{display:flex;align-items:baseline;gap:10px}
#hm{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.live{font-size:13px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#7ad69a;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(122,214,154,.55)}70%{box-shadow:0 0 0 8px rgba(122,214,154,0)}100%{box-shadow:0 0 0 0 rgba(122,214,154,0)}}
#date{font-size:14px;color:var(--ink);font-weight:600}
#sunInfo,#lifeInfo,#wxInfo{font-size:13px;color:var(--mut)}
#clock button{margin-top:8px;justify-self:start}
.panel{transition:opacity .5s}
#deptTip{position:fixed;left:0;top:0;transform:translate(16px,16px);pointer-events:none;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mut);display:grid;gap:2px;z-index:4;white-space:nowrap}
#deptTip.flip{transform:translate(calc(-100% - 16px),16px)}
#deptTip b{color:var(--ink);font-size:14px;font-weight:700}
#deptTip[hidden]{display:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0d1411;z-index:5;transition:opacity .9s;text-align:center;padding:24px}
#loading.done{opacity:0;pointer-events:none}
#loading p{color:var(--mut);margin:8px 0 0}
#loading strong{font-size:20px}
@media(max-width:640px){#title{padding:9px 12px;left:10px;top:10px}#title h1{font-size:17px}#title p{display:none}
 #clock{top:auto;bottom:10px;right:10px;left:10px;min-width:0;padding:10px 12px}#hm{font-size:26px}button{min-height:38px;padding:0 12px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<canvas id="c" tabindex="0" aria-label="Lebendes 3D-Bild des TT Entwicklungscampus mit Garten und Brunnen"></canvas>

<div id="clock" class="panel">
 <div class="now"><span id="hm">--:--</span><span class="live"><i></i>Live · Göppingen</span></div>
 <div id="date">–</div>
 <div id="sunInfo">–</div>
 <div id="wxInfo">–</div>
 <div id="lifeInfo">–</div>
</div>
<div id="deptTip" hidden></div>
<div id="loading"><div><strong>Baue Campus …</strong><p id="loadMsg">Gebäude, Garten und Fluss werden erzeugt</p></div></div>

<script type="module">

const $ = s => document.querySelector(s);

function init() {
// ============================================================ basics
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function stoneSet(S,cols,rows,base,varAmt,joint,jW,speck,seed){const c=document.createElement('canvas'),h=document.createElement('canvas');c.width=c.height=h.width=h.height=S;

const paverT=stoneSet(1024,4,8,[188,182,170],13,'#77736b',3.2,false,11);
const slabT=stoneSet(1024,3,4,[172,170,164],9,'#5e5b56',3.6,true,23);
const curbTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#c4c2bc';g.fillRect(0,0,w,h);for(let i=0;i<5200;i++){const l=R()<.5?rr(60,120):rr(210,250);g.fillStyle=`rgba(${l|0},${l|0},${l|0},${rr(.15,.45)})`;g.fillRect(R()*w,R()*h,rr(1,2.4),rr(1,2.4));}});
const mulchTex=ctex(512,512,(g,w,h)=>{g.fillStyle='#2e2118';g.fillRect(0,0,w,h);for(let i=0;i<5200;i++){const x=R()*w,y=R()*h,a=R()*3.14,l=rr(14,40);g.fillStyle=`hsl(${rr(18,34)},${rr(30,48)}%,${l}%)`;
  wrap(w,h,x,y,(X,Y)=>{g.save();g.translate(X,Y);g.rotate(a);g.fillRect(-rr(3,8),-rr(1,2.5),rr(6,16),rr(2,5));g.restore();});}});
const mulchN=normalFromCanvas(mulchTex.image,2.4);

const gravelTex = ctex(256,256,(g,w,h)=>{g.fillStyle='#bcae95';g.fillRect(0,0,w,h);for(let i=0;i<5200;i++){const l=rr(115,240)|0;g.fillStyle=`rgb(${l},${l*.95|0},${l*.85|0})`;const x=rr(0,w),y=rr(0,h),r=rr(.6,2.3);wrap(w,h,x,y,(X,Y)=>{g.beginPath();g.arc(X,Y,r,0,7);g.fill();});}});
const paveTex = ctex(512,512,(g,w,h)=>{g.fillStyle='#86837d';g.fillRect(0,0,w,h);const rows=8,rh=h/rows;for(let r=0;r<rows;r++){let x=-rr(0,70);while(x<w){const len=rr(64,128),l=rr(178,214)|0;g.fillStyle=`rgb(${l},${l-3},${l-9})`;g.fillRect(x+2,r*rh+2,len-4,rh-4);if(x<0){g.fillRect(x+w+2,r*rh+2,len-4,rh-4);}x+=len;}}});
const woodTex = ctex(512,512,(g,w,h)=>{const n=8;for(let i=0;i<n;i++){const b=rr(-16,16);g.fillStyle=`rgb(${208+b|0},${162+b|0},${110+b|0})`;g.fillRect(i*w/n,0,w/n,h);for(let k=0;k<26;k++){g.strokeStyle=`rgba(118,78,38,${rr(.05,.2)})`;g.lineWidth=rr(.5,2);const x=i*w/n+rr(3,w/n-3);g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+rr(-6,6),h*.3,x+rr(-6,6),h*.7,x,h);g.stroke();}g.fillStyle='rgba(60,38,18,.4)';g.fillRect(i*w/n,0,1.6,h);}});
const sedumTex = ctex(256,256,(g,w,h)=>{g.fillStyle='#64803a';g.fillRect(0,0,w,h);for(let i=0;i<6500;i++){const t=R();g.fillStyle=t<.07?`hsl(${rr(4,22)},38%,${rr(32,44)}%)`:t<.12?`hsl(52,50%,${rr(48,60)}%)`:`hsl(${rr(74,108)},${rr(28,46)}%,${rr(24,44)}%)`;const x=rr(0,w),y=rr(0,h),r=rr(.6,1.8);wrap(w,h,x,y,(X,Y)=>{g.beginPath();g.arc(X,Y,r,0,7);g.fill();});}});
const soilTex = ctex(256,256,(g,w,h)=>{g.fillStyle='#3a2b1f';g.fillRect(0,0,w,h);for(let i=0;i<3200;i++){const l=rr(28,92)|0;g.fillStyle=`rgb(${l+12},${l},${l*.7|0})`;g.fillRect(rr(0,w),rr(0,h),rr(1,3.4),rr(1,2.2));}});
const solarTex = ctex(256,128,(g,w,h)=>{g.fillStyle='#16233a';g.fillRect(0,0,w,h);g.strokeStyle='rgba(170,190,220,.45)';g.lineWidth=1.2;for(let x=0;x<=w;x+=w/8){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}for(let y=0;y<=h;y+=h/4){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}});
function leafTex(pal,count,needle){return ctex(512,512,(g,w,h)=>{g.scale(2,2);w=256;h=256;
  g.strokeStyle='rgba(72,52,32,.9)';g.lineWidth=2.2;
  for(let i=0;i<6;i++){g.beginPath();g.moveTo(w/2+rr(-20,20),h-4);g.quadraticCurveTo(rr(50,206),rr(90,170),rr(24,232),rr(24,130));g.stroke();}

const texGreen = leafTex([[96,42,28],[102,46,36],[86,44,44],[108,36,24],[90,40,34]],240,false);
const texBirch = leafTex([[76,52,44],[84,50,52],[92,42,38],[70,48,58]],240,false);
const texAutumn = leafTex([[16,78,46],[6,72,40],[30,84,50],[42,80,54],[2,62,34]],240,false);

function waterNormalTex(){const S=256,H=new Float32Array(S*S),waves=[];for(let i=0;i<28;i++){let kx=Math.round(rr(-9,9)),ky=Math.round(rr(-9,9));if(!kx&&!ky)kx=1;waves.push([kx,ky,rr(0,6.28),1/(1+Math.hypot(kx,ky)*.35)]);}

  const t=new THREE.DataTexture(d,S,S);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;t.needsUpdate=true;return t;}

function stripGeo(pts,width,yFn,uvS=1){const n=pts.length,pos=[],uv=[],idx=[];let acc=0;

const BLOBS=[[-28,-8,11,10,20,1,5],[-18,-20,10,9,-30,1,5],[-34,6,9,8,10,1,3],[-20,4,8,7,0,1,4],
 [22,-10,11,10,-15,1,4],[32,3,9,8,30,1,4],[14,1,8,7,0,1,3],[36,-14,7,6,0,1,2],
 [-2,-42,11,9,10,1,4],[12,-36,8,8,0,1,3],[-14,-38,8,7,0,1,2],[-2,-14,9,8,0,1,2],[-3,-25,6,7,0,.8,1]];
const blobs=BLOBS.map(([cx,cz,rx,rz,r,w,fl])=>({cx,cz,rx,rz,c:Math.cos(r*Math.PI/180),s:Math.sin(r*Math.PI/180),w,fl}));
const THR=.5, FH=3.7, ST=.45, Y0=.45, OH=.85;
function fieldK(x,z,k,jit=true){let f=0;for(const b of blobs){if(b.fl<=k)continue;const dx=x-b.cx,dz=z-b.cz,u=(dx*b.c+dz*b.s)/b.rx,v=(-dx*b.s+dz*b.c)/b.rz;f+=b.w*Math.exp(-(u*u+v*v));}

const bField=(x,z)=>(x<-75||x>75||z<-80||z>40)?0:fieldK(x,z,0,false);
function gradK(x,z,k){const e=.05;return [(fieldK(x+e,z,k)-fieldK(x-e,z,k))/(2*e),(fieldK(x,z+e,k)-fieldK(x,z-e,k))/(2*e)];}
function inDist(x,z,k){const f=fieldK(x,z,k),g=gradK(x,z,k);return (f-THR)/(Math.hypot(g[0],g[1])||1e-3);}

function extractLoops(k){
  const x0=-62,z0=-66,st=.5,nx=249,nz=197,F=new Float32Array(nx*nz);
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++)F[j*nx+i]=fieldK(x0+i*st,z0+j*st,k);
  const P=new Map(),adj=new Map();
  const pt=(i,j,d)=>{const kk=((j*nx+i)<<1)|d;if(!P.has(kk)){const a=F[j*nx+i],b=d?F[(j+1)*nx+i]:F[j*nx+i+1],t=(THR-a)/(b-a);P.set(kk,d?[x0+i*st,z0+(j+t)*st]:[x0+(i+t)*st,z0+j*st]);}return kk;};
  const link=(a,b)=>{if(!adj.has(a))adj.set(a,[]);if(!adj.has(b))adj.set(b,[]);adj.get(a).push(b);adj.get(b).push(a);};
  for(let j=0;j<nz-1;j++)for(let i=0;i<nx-1;i++){
    const v0=F[j*nx+i],v1=F[j*nx+i+1],v2=F[(j+1)*nx+i+1],v3=F[(j+1)*nx+i];
    const c=(v0>THR)|((v1>THR)<<1)|((v2>THR)<<2)|((v3>THR)<<3);if(c===0||c===15)continue;
    const e0=()=>pt(i,j,0),e1=()=>pt(i+1,j,1),e2=()=>pt(i,j+1,0),e3=()=>pt(i,j,1),ctr=(v0+v1+v2+v3)/4>THR;
    switch(c){case 1:case 14:link(e3(),e0());break;case 2:case 13:link(e0(),e1());break;case 3:case 12:link(e3(),e1());break;
      case 4:case 11:link(e1(),e2());break;case 6:case 9:link(e0(),e2());break;case 7:case 8:link(e2(),e3());break;
      case 5:if(ctr){link(e0(),e1());link(e2(),e3());}else{link(e3(),e0());link(e1(),e2());}break;
      case 10:if(ctr){link(e3(),e0());link(e1(),e2());}else{link(e0(),e1());link(e2(),e3());}break;}}
  const seen=new Set(),loops=[];
  for(const [s] of adj){if(seen.has(s))continue;const raw=[];let prev=-1,cur=s;
    for(let guard=0;guard<100000;guard++){seen.add(cur);raw.push(P.get(cur));const nb=adj.get(cur);const nxt=nb[0]!==prev?nb[0]:nb[1];prev=cur;cur=nxt;if(cur===undefined||cur===s||seen.has(cur))break;}
    if(raw.length<16)continue;

    const n=raw.length,cum=[0];for(let i=1;i<=n;i++){const a=raw[i-1],b=raw[i%n];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
    const L=cum[n],m=Math.max(24,Math.round(L/.55));let pts=[];let jj=0;
    for(let q=0;q<m;q++){const d=q*L/m;while(cum[jj+1]<d)jj++;const a=raw[jj],b=raw[(jj+1)%n],t=(d-cum[jj])/((cum[jj+1]-cum[jj])||1);pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
    for(let it=0;it<2;it++)pts=pts.map((p,i)=>{const a=pts[(i-1+m)%m],b=pts[(i+1)%m];return [p[0]*.5+(a[0]+b[0])*.25,p[1]*.5+(a[1]+b[1])*.25];});
    let area=0;for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%m];area+=a[0]*b[1]-b[0]*a[1];}area=Math.abs(area/2);if(area<50)continue;

    let sd=0;for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%m];sd+=-(b[1]-a[1])*nrm[i][0]+(b[0]-a[0])*nrm[i][1];}
    if(sd<0){pts.reverse();nrm.reverse();}
    let len=0;for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%m];len+=Math.hypot(b[0]-a[0],b[1]-a[1]);}
